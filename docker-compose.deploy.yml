services:

  mysql:
    image: mysql:8.0
    container_name: cinema-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: cinemabooking
    command: --innodb_buffer_pool_size=128M
    volumes:
      - ./Back/CinemaBooking.Api/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: Back/Dockerfile
    container_name: cinema-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=cinemabooking;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  frontend:
    build:
      context: .
      dockerfile: Front/Dockerfile
    container_name: cinema-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cinema-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
# Global Log Rotation (Protects your Pi's SD Card)
x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"
  driver: json-file